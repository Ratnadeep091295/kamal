<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamal Transport - Journey</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #f8f9fa;
            /* White/Light Grey background */
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #scroll-container {
            position: relative;
            z-index: 2;
            height: 14000px;
            /* Generous smooth journey */
            pointer-events: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
        }

        .loading-logo-wrap {
            width: clamp(140px, 14vw, 200px);
            animation: loaderPulse 2s ease-in-out infinite;
        }

        .loading-logo-wrap img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes loaderPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.88;
            }
            50% {
                transform: scale(1.035);
                opacity: 1;
            }
        }

        /* Overlay UI Sections */
        .section {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 0 10vw;
            /* Base side padding */
            color: #1c355e;
            pointer-events: none;
        }

        .logo {
            width: 180px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(40px);
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.8));
        }

        .section h1 {
            font-size: clamp(2.5rem, 3.5vw, 4rem);
            font-weight: 800;
            margin: 0;
            line-height: 0.98;
            text-transform: uppercase;
            letter-spacing: -2.5px;
            color: #ffffff;
            background: linear-gradient(135deg,
                    #ffffff 0%,
                    #edf5fc 45%,
                    #9fd1f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.9);
            filter: drop-shadow(0 2px 18px rgba(0, 0, 0, 0.7));
            opacity: 0;
            transform: translateY(40px);
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .section p {
            font-size: clamp(1rem, 1.3vw, 1.25rem);
            max-width: 460px;
            margin-top: 22px;
            margin-bottom: 0;
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: 0.3px;
            color: #dbe8f5;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
            opacity: 0;
            transform: translateY(40px);
            -webkit-font-smoothing: antialiased;
        }

        #sec-5 {
            top: 50%;
            transform: translateY(-50%);
            right: 7vw;
            left: auto;
            width: auto;
            max-width: 620px;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
        }

        #hero-backdrop {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            background:
                linear-gradient(270deg,
                    rgba(0, 0, 0, 0.95) 0%,
                    rgba(0, 0, 0, 0.88) 35%,
                    rgba(0, 0, 0, 0.60) 65%,
                    rgba(0, 0, 0, 0.15) 85%,
                    rgba(0, 0, 0, 0) 100%),
                linear-gradient(180deg,
                    rgba(0, 0, 0, 0.35) 0%,
                    transparent 30%,
                    transparent 70%,
                    rgba(0, 0, 0, 0.45) 100%);
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="loading-logo-wrap">
            <img src="assets/logo-classic.webp" alt="Kamal Transport">
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="hero-backdrop"></div>

    <div id="scroll-container">
        <!-- Text overlay: Final milestone only -->
        <div id="sec-5" class="section">
            <img src="assets/Kamalwhite.png" alt="Kamal Transport Logo" class="logo">
            <h1>Waste &amp; Bulk Hauling.</h1>
            <p>Ontario &middot; Michigan &middot; Seven-day operations</p>
        </div>
    </div>

    <!-- GSAP, Three.js, Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        window.addEventListener('error', function (e) {
            const loading = document.getElementById('loading');
            if (loading) loading.innerHTML += '<br><span style="color:red">Error: ' + e.message + ' at line ' + e.lineno + '</span>';
        });
    </script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        if (window.innerWidth >= 1024) {
            init3D();
        } else {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = '<div style="text-align:center; padding:2rem; line-height:1.5; font-family: \'Roboto\', sans-serif;">3D Animation blocked in mobile view.<br><span style="font-size: 0.85em; opacity: 0.8; font-weight: 300;">Please view on a desktop for the full experience.</span></div>';
            }
        }
        function createRoadTexture(renderer) {
            const canvas = document.createElement('canvas');

            // Texture dimensions (smaller resolution for natural anti-aliasing)
            canvas.width = 256;
            canvas.height = 1024;

            const ctx = canvas.getContext('2d');

            // ==========================================
            // 1. ASPHALT BASE
            // ==========================================

            ctx.fillStyle = '#202020';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ==========================================
            // 4. LEFT YELLOW EDGE LINE
            // ==========================================

            ctx.fillStyle = '#dcb640';

            const edgeDist = 6;
            const edgeWidth = 3;

            ctx.fillRect(edgeDist, 0, edgeWidth, canvas.height);

            // ==========================================
            // 5. RIGHT YELLOW EDGE LINE
            // ==========================================

            ctx.fillRect(
                canvas.width - edgeDist - edgeWidth,
                0,
                edgeWidth,
                canvas.height
            );

            // ==========================================
            // 6. CENTER WHITE DASHED LINE
            // ==========================================

            ctx.fillStyle = '#eeeeee';

            const centerX = canvas.width / 2;

            const dashWidth = 6;
            const dashLength = 250;
            const dashGap = 250;

            for (
                let y = 0;
                y < canvas.height;
                y += dashLength + dashGap
            ) {

                ctx.fillRect(
                    centerX - dashWidth / 2,
                    y,
                    dashWidth,
                    dashLength
                );
            }


            // ==========================================
            // 7. THREE.JS TEXTURE
            // ==========================================

            const texture = new THREE.CanvasTexture(canvas);

            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;

            // Repeat along road length
            texture.repeat.set(1, 20);

            // Three.js r128 uses encoding
            texture.encoding = THREE.sRGBEncoding;

            // Anisotropic filtering
            if (renderer) {
                texture.anisotropy =
                    renderer.capabilities.getMaxAnisotropy();
            }

            texture.needsUpdate = true;

            return texture;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            const loadingEl = document.getElementById('loading');

            // --- 1. Scene Setup & Natural Atmospheric Ambience ---
            const scene = new THREE.Scene();

            // Atmospheric Fog: softens horizon and creates seamless infinite depth
            const HORIZON_COLOR = '#c2d7ea';
            scene.fog = new THREE.Fog(HORIZON_COLOR, 150, 1600);

            // Natural Daylight Sky Gradient
            const skyCanvas = document.createElement('canvas');
            skyCanvas.width = 2;
            skyCanvas.height = 512;
            const skyCtx = skyCanvas.getContext('2d');
            const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
            skyGrad.addColorStop(0.0, '#276ab2'); // Atmospheric cerulean zenith
            skyGrad.addColorStop(0.35, '#5693c9'); // Soft daylight blue
            skyGrad.addColorStop(0.70, '#8eb8dc'); // Ambient haze
            skyGrad.addColorStop(1.0, HORIZON_COLOR); // Luminous horizon matching fog exactly
            skyCtx.fillStyle = skyGrad;
            skyCtx.fillRect(0, 0, 2, 512);
            const skyTex = new THREE.CanvasTexture(skyCanvas);
            skyTex.encoding = THREE.sRGBEncoding;
            scene.background = skyTex;

            // Seamless Organic Meadow Terrain Texture
            const groundCanvas = document.createElement('canvas');
            groundCanvas.width = 1024;
            groundCanvas.height = 1024;
            const groundCtx = groundCanvas.getContext('2d');
            groundCtx.fillStyle = '#7a8c6e'; // Natural balanced meadow earth base
            groundCtx.fillRect(0, 0, 1024, 1024);

            // Multi-scale soft stippling for organic micro-texture without repetitive tiling
            for (let i = 0; i < 20000; i++) {
                const rx = Math.random() * 1024;
                const ry = Math.random() * 1024;
                const shade = Math.random();
                if (shade > 0.65) {
                    groundCtx.fillStyle = 'rgba(142, 160, 126, 0.35)'; // Soft grass highlight
                } else if (shade > 0.35) {
                    groundCtx.fillStyle = 'rgba(96, 112, 85, 0.35)';   // Grass depth
                } else {
                    groundCtx.fillStyle = 'rgba(118, 110, 92, 0.25)';  // Warm loam soil
                }
                const sz = Math.random() * 4 + 1;
                groundCtx.fillRect(rx, ry, sz, sz);
            }

            const groundTex = new THREE.CanvasTexture(groundCanvas);
            groundTex.wrapS = THREE.RepeatWrapping;
            groundTex.wrapT = THREE.RepeatWrapping;
            groundTex.repeat.set(32, 32);
            groundTex.encoding = THREE.sRGBEncoding;

            // Large terrain plane - blends seamlessly into horizon fog with zero visible edge
            const groundGeo = new THREE.PlaneGeometry(16000, 16000);
            const groundMat = new THREE.MeshStandardMaterial({
                map: groundTex,
                color: '#b0c2a7', // Harmonious tint that naturally blends into fog
                roughness: 0.98,
                metalness: 0.0
            });
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.position.y = 0.0; // Sitting flush right under road
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // --- 2. Camera Setup ---
            const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 10, 5000);
            const cameraRig = new THREE.Group();
            scene.add(cameraRig);
            cameraRig.add(camera);

            // --- 3. Renderer Setup ---
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // --- 4. Natural Lighting ---
            // Sky hemisphere light: natural blue sky bounce and green earth bounce
            const hemiLight = new THREE.HemisphereLight('#8eb9dd', '#5a674e', 0.65);
            scene.add(hemiLight);

            // Ambient fill
            const ambientLight = new THREE.AmbientLight('#d8e6f3', 0.35);
            scene.add(ambientLight);

            // Warm natural sun light
            const dirLight = new THREE.DirectionalLight('#fff4e0', 1.6);
            dirLight.position.set(120, 320, 120);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 2000;
            const d = 600;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.updateProjectionMatrix();
            scene.add(dirLight);
            scene.add(dirLight.target);

            // --- 5. Road Generation ---
            // Create a road path: straight to the station, then winding through trade corridors
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),             // Start (Scene 1)
                new THREE.Vector3(0, 0, -450),          // Loading Site (Scene 2)
                new THREE.Vector3(-350, 0, -1050),      // Curve Left
                new THREE.Vector3(200, 0, -1800),       // Curve Right
                new THREE.Vector3(500, 0, -2500),       // Waste Facility (Scene 4)
                new THREE.Vector3(0, 0, -3200)          // End (Scene 5)
            ]);

            function computeCurvature(u) {
                const clampedU = Math.max(0, Math.min(1, u));
                const pA = Math.max(0, clampedU - 0.006);
                const pB = Math.min(1, clampedU + 0.006);
                const tA = curve.getTangentAt(pA);
                const tB = curve.getTangentAt(pB);
                const angA = Math.atan2(tA.x, tA.z);
                const angB = Math.atan2(tB.x, tB.z);
                let diff = angB - angA;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                return diff / 0.012;
            }

            function buildTurnZones(curveRef) {
                const SAMPLES = 400;
                const samples = [];
                for (let i = 0; i <= SAMPLES; i++) {
                    const p = i / SAMPLES;
                    samples.push({ p: p, c: computeCurvature(p) });
                }
                const CURV_THRESHOLD = 0.8;
                const zones = [];
                let curZone = null;
                for (let i = 0; i <= SAMPLES; i++) {
                    const s = samples[i];
                    if (s.p <= 0.155) continue;
                    const isLeft = s.c > CURV_THRESHOLD;
                    const isRight = s.c < -CURV_THRESHOLD;
                    const dir = isLeft ? 'LEFT' : (isRight ? 'RIGHT' : 'STRAIGHT');
                    if (curZone) {
                        if (dir === curZone.type) {
                            curZone.end = s.p;
                        } else {
                            if (curZone.end - curZone.start >= 0.02) {
                                zones.push(curZone);
                            }
                            curZone = (dir !== 'STRAIGHT') ? { type: dir, start: s.p, end: s.p } : null;
                        }
                    } else {
                        if (dir !== 'STRAIGHT') {
                            curZone = { type: dir, start: s.p, end: s.p };
                        }
                    }
                }
                if (curZone && curZone.end - curZone.start >= 0.02) {
                    zones.push(curZone);
                }
                zones.forEach(z => {
                    const len = z.end - z.start;
                    const transLen = Math.min(len * 0.3, 0.035);
                    z.enterEnd = z.start + transLen;
                    z.exitStart = z.end - transLen;
                });
                return zones;
            }

            const turnZones = buildTurnZones(curve);

            function createRoadGeometry(curve, segments, width) {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const uvs = [];
                const indices = [];
                const points = curve.getPoints(segments);

                // Extend road far past start and end so it doesn't suddenly appear/disappear
                const firstTangent = new THREE.Vector3().subVectors(points[1], points[0]).normalize();
                const pStart = points[0].clone().addScaledVector(firstTangent, -2000);

                const lastTangent = new THREE.Vector3().subVectors(points[points.length - 1], points[points.length - 2]).normalize();
                const pEnd = points[points.length - 1].clone().addScaledVector(lastTangent, 2000);

                points.unshift(pStart);
                points.push(pEnd);

                const totalPoints = points.length;

                for (let i = 0; i < totalPoints; i++) {
                    const p = points[i];

                    let tangent;
                    if (i === 0) tangent = firstTangent;
                    else if (i === totalPoints - 1) tangent = lastTangent;
                    else tangent = curve.getTangent((i - 1) / segments);

                    tangent.y = 0;
                    tangent.normalize();

                    const normal = new THREE.Vector3(0, 1, 0);
                    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

                    const pLeft = p.clone().add(binormal.clone().multiplyScalar(-width / 2));
                    const pRight = p.clone().add(binormal.clone().multiplyScalar(width / 2));
                    pLeft.y = 0;
                    pRight.y = 0;

                    vertices.push(pLeft.x, pLeft.y, pLeft.z);
                    vertices.push(pRight.x, pRight.y, pRight.z);

                    // UV mapping (distribute evenly)
                    const v = i / (totalPoints - 1);
                    uvs.push(0, v);
                    uvs.push(1, v);
                }

                for (let i = 0; i < totalPoints - 1; i++) {
                    const a = i * 2;
                    const b = i * 2 + 1;
                    const c = (i + 1) * 2;
                    const d = (i + 1) * 2 + 1;
                    indices.push(a, c, b);
                    indices.push(b, c, d);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
                return geometry;
            }

            const roadTexture = createRoadTexture(renderer);
            const roadGeom = createRoadGeometry(curve, 1000, 40);

            // Subtle integrated road shoulder transitioning seamlessly into the meadow
            const roadShoulderGeom = createRoadGeometry(curve, 1000, 48);
            const roadShoulderMat = new THREE.MeshStandardMaterial({
                color: '#656f5c',
                roughness: 0.98,
                metalness: 0.0,
                side: THREE.DoubleSide
            });
            const roadShoulderMesh = new THREE.Mesh(roadShoulderGeom, roadShoulderMat);
            roadShoulderMesh.receiveShadow = true;
            roadShoulderMesh.position.y = 0.04;
            scene.add(roadShoulderMesh);

            const roadMat = new THREE.MeshStandardMaterial({
                map: roadTexture,
                roughness: 0.9,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const roadMesh = new THREE.Mesh(roadGeom, roadMat);
            roadMesh.receiveShadow = true;
            roadMesh.position.y = 0.1; // Slightly above road shoulder
            scene.add(roadMesh);

            // --- 6. Dumping Yard Ground & Geometry Setup ---
            const unloadPoint = curve.getPointAt(0.78);
            const unloadTangent = curve.getTangentAt(0.78).normalize();
            const yardNormal = new THREE.Vector3(0, 1, 0);
            const yardRight = new THREE.Vector3().crossVectors(unloadTangent, yardNormal).normalize();

            // Dumping Yard Ground Pad - organic feathered edge seamlessly blending into meadow terrain
            const yardCanvas = document.createElement('canvas');
            yardCanvas.width = 512;
            yardCanvas.height = 512;
            const yardCtx = yardCanvas.getContext('2d');
            const yardGrad = yardCtx.createRadialGradient(256, 256, 20, 256, 256, 250);
            yardGrad.addColorStop(0.0, 'rgba(22, 25, 28, 0.92)'); // Industrial coal & asphalt center
            yardGrad.addColorStop(0.35, 'rgba(38, 44, 42, 0.80)'); // Packed gravel
            yardGrad.addColorStop(0.60, 'rgba(62, 72, 60, 0.50)'); // Gravel-soil transitional zone
            yardGrad.addColorStop(0.82, 'rgba(122, 140, 110, 0.20)'); // Matching meadow hue
            yardGrad.addColorStop(1.0, 'rgba(122, 140, 110, 0.0)');  // Completely feathering out to invisible
            yardCtx.fillStyle = yardGrad;
            yardCtx.fillRect(0, 0, 512, 512);

            // Add organic grit noise to break up any circular edge
            yardCtx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            for (let i = 0; i < 4000; i++) {
                const rx = Math.random() * 512;
                const ry = Math.random() * 512;
                const dist = Math.hypot(rx - 256, ry - 256);
                if (dist < 245) {
                    yardCtx.fillRect(rx, ry, Math.random() * 3 + 1, Math.random() * 3 + 1);
                }
            }

            const yardTex = new THREE.CanvasTexture(yardCanvas);
            yardTex.encoding = THREE.sRGBEncoding;

            const yardGeo = new THREE.CircleGeometry(160, 64);
            const yardMat = new THREE.MeshStandardMaterial({
                map: yardTex,
                transparent: true,
                depthWrite: false, // Prevents z-fighting and seam lines
                roughness: 0.98,
                metalness: 0.02
            });
            const yardMesh = new THREE.Mesh(yardGeo, yardMat);
            yardMesh.rotation.x = -Math.PI / 2;
            const yardCenterPos = unloadPoint.clone()
                .addScaledVector(yardRight, 34)
                .addScaledVector(unloadTangent, -30);
            yardMesh.position.set(yardCenterPos.x, 0.02, yardCenterPos.z);
            yardMesh.receiveShadow = true;
            scene.add(yardMesh);

            // --- 7. Load Models ---
            const loader = new THREE.GLTFLoader();

            // Driving truck container and model wrappers
            const truckContainer = new THREE.Group();
            scene.add(truckContainer);
            let truckModel = truckContainer; // Keep reference for camera tracking

            let truckStraightWrapper = null;
            let truckLeftWrapper = null;
            let truckRightWrapper = null;

            let mixerStraight = null;
            let mixerLeft = null;
            let mixerRight = null;

            // Coal Loading Site (Station 1: JCB + Coal Field + Animated Lid)
            const coalLoadSiteGroup = new THREE.Group();
            scene.add(coalLoadSiteGroup);
            coalLoadSiteGroup.visible = false;

            let coalLoadModel = null;
            let mixerCoalLoad = null;

            // Coal Unloading / Dumping Site (Station 2: Waste Facility Walking Floor & Discharge)
            const coalUnloadSiteGroup = new THREE.Group();
            scene.add(coalUnloadSiteGroup);
            coalUnloadSiteGroup.visible = false;

            let coalUnloadModel = null;
            let mixerCoalUnload = null;

            // Shared Normalization Metrics across all models
            let metricsInitialized = false;
            let truckScaleFactor = 1;
            let truckRawCenter = new THREE.Vector3();
            let truckRawHeight = 30;

            function initMetricsFromModel(model) {
                if (metricsInitialized) return;
                const box = new THREE.Box3().setFromObject(model);
                const rawSize = box.getSize(new THREE.Vector3());
                truckRawCenter.copy(box.getCenter(new THREE.Vector3()));
                truckRawHeight = rawSize.y;
                const maxRawDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
                truckScaleFactor = 100 / maxRawDim;
                metricsInitialized = true;
            }

            function createSubTruckWrapper(model) {
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if (node.material) {
                            node.material.envMapIntensity = 0.5;
                            // Prevent specular white blowout hotspots on the truck cab and trailer
                            if (node.material.roughness !== undefined && node.material.roughness < 0.35) {
                                node.material.roughness = 0.45;
                            }
                        }
                    }
                });

                const centering = new THREE.Group();
                centering.add(model);
                centering.position.set(-truckRawCenter.x, -truckRawCenter.y + (truckRawHeight / 2), -truckRawCenter.z);

                const rotating = new THREE.Group();
                rotating.rotation.y = Math.PI / 2;
                rotating.scale.set(truckScaleFactor, truckScaleFactor, truckScaleFactor);
                rotating.add(centering);

                return rotating;
            }

            // State for GSAP Timeline & scrubbing
            const sceneState = {
                progress: 0,
                loadProgress: 0,
                unloadProgress: 0,
                camRadius: 150,
                camHeight: 50,
                camTheta: Math.PI / 2, // Side view initially
                camLookForward: 20,
                camLookSide: 0,
                camLookY: 0,
                camPanForward: 0,
                camCustomBlend: 0, // 0 = orbit tracking, 1 = custom local coordinates
                camLocalX: 0,
                camLocalY: 24,
                camLocalZ: -12,
                camTargetX: 0,
                camTargetY: 19.5,
                camTargetZ: -48,
                animProgress: 0,
                coalScale: 1
            };

            let assetsLoaded = 0;

            // --- 8. GSAP ScrollTrigger Sequence ---

                tl.to(sceneState, {

            // --- 9. Render Loop ---
            const truckPos = new THREE.Vector3();
            const truckTangent = new THREE.Vector3();
            const tanA = new THREE.Vector3();
            const tanB = new THREE.Vector3();

            let lastProgress = 0;
            let wheelSpinDistance = 0;

            function getTruckPathState(p) {
                const roadPoint = curve.getPointAt(p);
                const roadTangent = curve.getTangentAt(p).normalize();
                const up = new THREE.Vector3(0, 1, 0);
                const roadRight = new THREE.Vector3().crossVectors(roadTangent, up).normalize();

                // Smooth, gentle pull-off beside road into Dumping Yard parking bay:
                // Approach & pull-in: 0.745 to 0.780 (subtle natural angle)
                // Parked hold: 0.780 to 0.788
                // Pull-out back to highway: 0.788 to 0.822
                const MAX_OFFSET = 34;
                let yardOffset = 0;
                let turnPhase = 'NONE';
                if (p >= 0.745 && p <= 0.780) {
                    const t = (p - 0.745) / 0.035;
                    const s = t * t * (3 - 2 * t);
                    yardOffset = s * MAX_OFFSET;
                    turnPhase = 'IN';
                } else if (p > 0.780 && p < 0.788) {
                    yardOffset = MAX_OFFSET;
                    turnPhase = 'PARKED';
                } else if (p >= 0.788 && p <= 0.822) {
                    const t = (p - 0.788) / 0.034;
                    const s = t * t * (3 - 2 * t);
                    yardOffset = (1 - s) * MAX_OFFSET;
                    turnPhase = 'OUT';
                }

                const pos = roadPoint.clone().addScaledVector(roadRight, yardOffset);
                return { pos, yardOffset, roadTangent, roadRight, turnPhase };
            }

            function getTruckHeading(p) {
                const delta = 0.0012;
                const pPrev = Math.max(0, p - delta);
                const pNext = Math.min(1, p + delta);
                const p1 = getTruckPathState(pPrev).pos;
                const p2 = getTruckPathState(pNext).pos;
                const heading = p2.clone().sub(p1);
                if (heading.lengthSq() > 0.000001) {
                    heading.normalize();
                } else {
                    heading.copy(curve.getTangentAt(p).normalize());
                }
                return heading;
            }

            function animate() {
                requestAnimationFrame(animate);

                if (truckModel) {
                    // Update Truck Position & Natural Heading along smooth path
                    const pathState = getTruckPathState(sceneState.progress);
                    truckPos.copy(pathState.pos);
                    const truckHeading = getTruckHeading(sceneState.progress);
                    const truckUp = new THREE.Vector3(0, 1, 0);
                    const truckRight = new THREE.Vector3().crossVectors(truckHeading, truckUp).normalize();

                    truckModel.position.copy(truckPos);
                    const lookAtTarget = truckPos.clone().add(truckHeading);
                    truckModel.lookAt(lookAtTarget);

                    // Move directional light with truck
                    dirLight.position.set(truckPos.x + 100, truckPos.y + 300, truckPos.z + 100);
                    dirLight.target.position.copy(truckPos);
                    dirLight.target.updateMatrixWorld();

                    // --- Camera Choreography with Dual Mode Blending ---
                    // 1. Orbit Mode (for highway driving and centered yard arrival)
                    const headingAngle = Math.atan2(truckHeading.x, truckHeading.z);
                    const finalTheta = headingAngle + sceneState.camTheta;

                    const orbitPos = new THREE.Vector3(
                        truckPos.x + (Math.sin(finalTheta) * sceneState.camRadius),
                        truckPos.y + sceneState.camHeight,
                        truckPos.z + (Math.cos(finalTheta) * sceneState.camRadius)
                    );
                    const panOffset = truckHeading.clone().multiplyScalar(sceneState.camPanForward);
                    orbitPos.add(panOffset);

                    const orbitLook = truckPos.clone()
                        .addScaledVector(truckHeading, sceneState.camLookForward)
                        .addScaledVector(truckRight, sceneState.camLookSide);
                    orbitLook.add(panOffset);
                    orbitLook.y += sceneState.camLookY;

                    // 2. Custom Local Mode (for inside truck conveyor shot & exterior dump shot)
                    const customPos = truckPos.clone()
                        .addScaledVector(truckRight, sceneState.camLocalX)
                        .addScaledVector(truckHeading, sceneState.camLocalZ);
                    customPos.y += sceneState.camLocalY;

                    const customLook = truckPos.clone()
                        .addScaledVector(truckRight, sceneState.camTargetX)
                        .addScaledVector(truckHeading, sceneState.camTargetZ);
                    customLook.y += sceneState.camTargetY;

                    // 3. Smooth Lerp Blending
                    const blend = Math.max(0, Math.min(1, sceneState.camCustomBlend));
                    camera.position.lerpVectors(orbitPos, customPos, blend);
                    const finalLook = orbitLook.clone().lerp(customLook, blend);
                    camera.lookAt(finalLook);

                    // Wheel spinning distance for straight driving
                    const dProg = Math.abs(sceneState.progress - lastProgress);
                    wheelSpinDistance += dProg * 2500;
                    lastProgress = sceneState.progress;
                    const straightWheelTime = (wheelSpinDistance * 0.05) % 4.625;

                    // --- Natural, Subtle Steering Animation ---
                    // Clamp maximum wheel turn to 0.95s (out of 2.3125s) for authentic, gentle steering angles
                    const T_STEER_MAX = 0.95;

                    if (pathState.turnPhase === 'IN' && sceneState.progress >= 0.748 && sceneState.progress <= 0.778) {
                        // Naturally turning right into the dumping yard
                        const inRatio = (sceneState.progress - 0.748) / 0.030;
                        const steerTime = inRatio < 0.5
                            ? (inRatio / 0.5) * T_STEER_MAX
                            : (1 - (inRatio - 0.5) / 0.5) * T_STEER_MAX;
                        if (truckRightWrapper) truckRightWrapper.visible = true;
                        if (truckStraightWrapper) truckStraightWrapper.visible = false;
                        if (truckLeftWrapper) truckLeftWrapper.visible = false;
                        if (mixerRight) mixerRight.setTime(steerTime);
                    } else if (pathState.turnPhase === 'OUT' && sceneState.progress >= 0.789 && sceneState.progress <= 0.819) {
                        // Naturally turning left out of dumping yard back onto road
                        const outRatio = (sceneState.progress - 0.789) / 0.030;
                        const steerTime = outRatio < 0.5
                            ? (outRatio / 0.5) * T_STEER_MAX
                            : (1 - (outRatio - 0.5) / 0.5) * T_STEER_MAX;
                        if (truckLeftWrapper) truckLeftWrapper.visible = true;
                        if (truckStraightWrapper) truckStraightWrapper.visible = false;
                        if (truckRightWrapper) truckRightWrapper.visible = false;
                        if (mixerLeft) mixerLeft.setTime(steerTime);
                    } else {
                        // Standard highway curvature turn zones
                        let activeZone = null;
                        if (sceneState.progress > 0.155 && sceneState.progress < 0.745) {
                            for (let i = 0; i < turnZones.length; i++) {
                                const z = turnZones[i];
                                if (sceneState.progress >= z.start && sceneState.progress <= z.end) {
                                    activeZone = z;
                                    break;
                                }
                            }
                        }

                        if (activeZone) {
                            let turnRatio = 0.5;
                            if (sceneState.progress < activeZone.enterEnd) {
                                turnRatio = (sceneState.progress - activeZone.start) / Math.max(0.0001, activeZone.enterEnd - activeZone.start);
                            } else if (sceneState.progress > activeZone.exitStart) {
                                turnRatio = 1.0 - ((sceneState.progress - activeZone.exitStart) / Math.max(0.0001, activeZone.end - activeZone.exitStart));
                            } else {
                                turnRatio = 1.0;
                            }
                            const turnAnimTime = Math.max(0, Math.min(T_STEER_MAX, turnRatio * T_STEER_MAX));

                            if (activeZone.type === 'LEFT') {
                                if (truckLeftWrapper) truckLeftWrapper.visible = true;
                                if (truckStraightWrapper) truckStraightWrapper.visible = false;
                                if (truckRightWrapper) truckRightWrapper.visible = false;
                                if (mixerLeft) mixerLeft.setTime(turnAnimTime);
                            } else {
                                if (truckRightWrapper) truckRightWrapper.visible = true;
                                if (truckStraightWrapper) truckStraightWrapper.visible = false;
                                if (truckLeftWrapper) truckLeftWrapper.visible = false;
                                if (mixerRight) mixerRight.setTime(turnAnimTime);
                            }
                        } else {
                            // Driving Straight: Truck_Straight.glb
                            if (truckStraightWrapper) truckStraightWrapper.visible = true;
                            if (truckLeftWrapper) truckLeftWrapper.visible = false;
                            if (truckRightWrapper) truckRightWrapper.visible = false;
                            if (mixerStraight) mixerStraight.setTime(straightWheelTime);
                        }
                    }

                    // --- Station Visibility and Animation Triggering ---
                    // 1. Station 1 (Loading Site, progress = 0.1500 standstill only):
                    // Perfectly swaps when truck is completely stopped to eliminate any teleport frame jerk
                    const atLoadingStation = (sceneState.progress >= 0.1498 && sceneState.progress <= 0.1502 && sceneState.loadProgress < 1.0);

                    // 2. Station 2 (Unloading / Dumping Site, progress ~ 0.78):
                    const atUnloadStation = (sceneState.progress >= 0.779 && sceneState.progress <= 0.788);

                    if (atLoadingStation) {
                        truckContainer.visible = false;
                        coalLoadSiteGroup.visible = true;
                        if (coalUnloadSiteGroup) coalUnloadSiteGroup.visible = false;

                        if (mixerCoalLoad) {
                            mixerCoalLoad.setTime(sceneState.loadProgress * 20.8333);
                        }
                    } else if (atUnloadStation) {
                        truckContainer.visible = false;
                        coalLoadSiteGroup.visible = false;
                        if (coalUnloadSiteGroup) {
                            coalUnloadSiteGroup.visible = true;
                            if (mixerCoalUnload) {
                                mixerCoalUnload.setTime(sceneState.unloadProgress * 20.8333);
                            }
                        }
                    } else {
                        // Open highway driving:
                        truckContainer.visible = true;
                        coalLoadSiteGroup.visible = false;
                        if (coalUnloadSiteGroup) coalUnloadSiteGroup.visible = false;
                    }
                }

                renderer.render(scene, camera);
            }
            animate();

            // --- 10. Resize ---
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>

</html>
